map $http_x_forwarded_proto $ceo_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_x_forwarded_host $ceo_forwarded_host {
  default $http_x_forwarded_host;
  "" $http_host;
}

map $arg_screen $ceo_page {
  default objects;
  ~^(objects|wallet|wallet-white|nfc|next-item|access|code-error|cart|cart-empty|checkout|checkout-validation|payment|processing|payment-failed|thank-you|order|join|application|application-received|membership-confirmed|purchase-application|purchase-received|faq|loading|contact|menu|contact-received|privacy|agreement|purchase-terms|company|data-consent|cookies|screens)$ $arg_screen;
}

map $args $ceo_page_query {
  "" "";
  ~^screen=[^&]*$ "";
  ~^screen=[^&]*&(.+)$ ?$1;
  ~^(.+)&screen=[^&]*(&.*)?$ ?$1$2;
  default ?$args;
}

server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  # Match the original request, not internal index/try_files redirects.
  if ($request_uri ~ "^/index\.html(?:\?|$)") {
    return 301 /$is_args$args;
  }
  if ($request_uri ~ "^/app\.html(?:\?|$)") {
    return 301 /$ceo_page$ceo_page_query;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $ceo_forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ceo_forwarded_proto;
    proxy_read_timeout 60s;
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~ ^/(objects|wallet|wallet-white|nfc|next-item|access|code-error|cart|cart-empty|checkout|checkout-validation|payment|processing|payment-failed|thank-you|order|join|application|application-received|membership-confirmed|purchase-application|purchase-received|faq|loading|contact|menu|contact-received|privacy|agreement|purchase-terms|company|data-consent|cookies|screens)$ {
    try_files /app.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
